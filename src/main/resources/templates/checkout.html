<!doctype html>
<html lang="vi" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FakePay - Checkout</title>
    <style>
        body { font-family: "Segoe UI", Roboto, Arial; background:#f4f6f8; margin:0; padding:30px; }
        .card { max-width:560px; margin:30px auto; background:#fff; border-radius:10px; padding:24px; box-shadow:0 6px 20px rgba(0,0,0,0.08);}
        h1{margin:0 0 12px;font-size:20px}
        .row{display:flex;justify-content:space-between;margin:8px 0}
        .muted{color:#666;font-size:14px}
        .amount{font-weight:700;font-size:20px;color:#111}
        .btn{display:inline-block;padding:10px 18px;border-radius:8px;border:0;cursor:pointer;font-size:15px}
        .btn-success{background:#08a045;color:#fff}
        .btn-cancel{background:#e03a3a;color:#fff;margin-left:8px}
        .small{font-size:13px;color:#777;margin-top:10px}
    </style>
</head>
<body>

<div class="card">
    <h1>Thanh toán — FakePay</h1>

    <!-- Hiển thị order (có thể set bằng server-side templating hoặc JS) -->
    <div class="row"><div class="muted">Mã đơn</div><div id="orderId">ORD12345</div></div>
    <div class="row"><div class="muted">Khách hàng</div><div id="customerName">Nguyễn Văn A</div></div>
    <div class="row"><div class="muted">Số tiền</div><div class="amount" id="amount">100,000 VND</div></div>
    <div class="small">Bạn sẽ được chuyển đến cổng thanh toán giả lập. Đây là trang demo chỉ để test flow.</div>

    <hr style="margin:18px 0">

    <!-- FORM gửi về backend (POST) -->
    <form th:action="@{/fakepay/pay/{id}(id=${order.orderId})}" method="post" style="text-align:center">
        <!-- backend có thể lấy từ param này -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <button type="submit" class="btn btn-success" name="action" value="success">Thanh toán thành công</button>
            <button type="submit" class="btn btn-cancel" name="action" value="cancel">Hủy thanh toán</button>
        </div>
    </form>

    <hr style="margin:18px 0">

    <!-- AJAX option (nếu bạn muốn submit bằng fetch và hiển thị result ngay trên client) -->

</div>


</body>
</html>
