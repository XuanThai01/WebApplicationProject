<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir-icons/css/iconoir.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">


    <link rel="stylesheet" href="/images/banner/style-homepage.css">
    <link rel="stylesheet" href="/images/banner/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .product-name{
     transition: all 0.3s ease;
   }
   .product:hover .product-name{

     color: rgb(246, 81, 27);
   }
    .product-size {
        max-height: 60px; /* Giới hạn chiều cao khung */
        text-align: center;
    }
   .product-price{
     color: rgb(205, 70, 70);
   }
    .product-size span{
       margin-top : 3px;
   }
   .product-size > span.active {
       color: aliceblue;
       background-color: rgb(74, 157, 87);
   }
   .table-pd img,span{
     cursor : pointer;
   }
      body {
            margin: 0;

        }

        /* Nền tối overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1051;
            pointer-events: auto; /* chặn click xuyên qua */
        }

        /* Container */
        .iframe-container {
            position: relative;
            background: white;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: dropIn 0.6s ease-out forwards;
        }

        /* Keyframes xuất hiện */
        @keyframes dropIn {
            from {
                transform: translateY(-60px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Keyframes biến mất */
        @keyframes dropOut {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-60px);
                opacity: 0;
            }
        }

        /* Khi đóng thì gán class này */
        .bienmat {
            animation: dropOut 0.6s ease forwards;
        }
        .hienlai {
             animation: dropIn 0.6s ease forwards;
        }
    </style>
</head>

<body>
<!-- Overlay chứa iframe -->

<div class="overlay" id="overlay">
    <div class="iframe-container" id="iframeContainer">
        <iframe src="/login-page" width="768" height="480" style="border-radius:30px;display:block" ></iframe>
    </div>
</div>

<!-- Gọi fragment loginModal -->
<div style="position: sticky;top: 0;z-index: 1050;">
    <div id="menu" th:replace="(~{menu :: menu})"></div>
</div>

<div class="container mt-2">

    <div class="row">
        <div class="col-9">

            <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <!-- Indicators -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0"
                            class="active"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
                </div>

                <!-- Slides -->

                <div class=" carousel-inner" style="width: 100%;height: 450px;background-color: aquamarine;">
                    <div class="carousel-item active" style="width: 100%;height: 100%">
                        <img style="width:100%; height:100%; object-fit:cover; "  src="/image/img_banner/Banner1.jpg"
                             alt="Ảnh 1">
                    </div>
                    <div class="carousel-item">
                        <img style="width: 100%;object-fit: cover;" src="/image/img_banner/Banner2.jpg" alt="Ảnh 2">
                    </div>
                    <div class="carousel-item">
                        <img style="width: 100%;transform: translate(0, -60px);object-fit: cover;"
                             src="/image/img_banner/Spy_Family_Wallpaper.jpg" alt="Ảnh 3">
                    </div>
                </div>


                <!-- Controls -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>
        <div class="col-3 " style="border: 1px saddlebrown solid;">
            <div class="w-100" style="height: 50%; border: 1px springgreen solid;"></div>
            <div class="w-100" style="height: 50%; border: 1px springgreen solid;"></div>
        </div>
    </div>
</div>
<div class="container">
    <div class="row row-cols-4 my-2" style="font-size: 18px;font-weight: 500;text-align: center;">
        <div><i class="bi bi-car-front-fill"></i>giao hàng siêu tốc</div>
        <div><i class="bi bi-bag-fill"></i>chất lượng siêu tốt</div>
        <div><?xml version="1.0" encoding="UTF-8"?>
            <svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg" color="#000000">
                <path d="M20.9999 3.99999L21 20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V4C3 2.89543 3.89543 2 5 2H18.9999C20.1045 2 20.9999 2.89543 20.9999 3.99999Z"
                      stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M18 5.01L18.01 4.99889" stroke="#000000" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round"></path>
                <path d="M12 19C15.3137 19 18 16.3137 18 13C18 9.68629 15.3137 7 12 7C8.68629 7 6 9.68629 6 13C6 16.3137 8.68629 19 12 19Z"
                      stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 16C10.3431 16 9 14.6569 9 13" stroke="#000000" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round"></path>
            </svg>
            giặt gấu bông
        </div>
        <div>hút chân không làm nhỏ gấu</div>
    </div>
</div>
<div class="container" style="text-align: center;">
    <h3>GẤU BÔNG HOT</h3>
    <div class="row">
        <div class="col-3 table-pd" th:each="pd : ${listpd}" th:data-idpd="${pd.pd_id}">
            <!--    -->
            <div class="col-button product" style="height: 450px; ">

                <img class="product-img" style="width: 100%;height: 310px;background-color: aqua;object-fit: cover" th:src="@{${pd.imgProduct}}" alt="">
                <p class="product-name fw-semibold" th:text="${pd.name}">tên</p>
                <p class="product-price">giá tiền</p>
                <div class="product-size w-100 d-flex flex-wrap justify-content-center align-items-center rounded">
                    <span th:each="v : ${pd.productVariants}"
                          th:data-id="${v.id}"
                          th:text="${v.size}"
                          th:data-price="${v.price}"
                          class="variant-item mx-1 px-2 rounded">
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    $(document).ready(function(){

         $("#searchInput").on("keyup", function () {
        let keyword = $(this).val();
        if (keyword.length >= 2) { // gõ >= 2 ký tự mới tìm
            $.ajax({
                url: "/api/products/search",
                type: "GET",
                data: {keyword: keyword},
                success: function (data) {
              console.log("thành công ", data);
                    let resultBox = $("#searchResult");
                    resultBox.empty();
                    if (data.length > 0) {
                           console.log("lớn hơn 1")
                        data.forEach(p => {
                            resultBox.append(`
                                   <a href="" class="list-group-item list-group-item-action">${p.name}</a>
                            `);

                        });
                    }

                }
            });
        } else {
            $("#searchResult").empty();
        }
    });

        $(".table-pd").each(function(){
            var container = $(this);

            // Set size đầu tiên active
            var firstSpan = container.find(".product-size span").first();
            firstSpan.addClass("active");

            // Hiển thị giá mặc định cho sản phẩm này
            container.find(".product-price").text(
                "giá : " + firstSpan.data("price").toLocaleString("vi-VN") + " đ"
            );

            // Click vào size đổi active và update giá
            container.find(".product-size span").click(function(){
                container.find(".product-size span").removeClass("active");
                $(this).addClass("active");

                container.find(".product-price").text(
                    "giá : " + $(this).data("price").toLocaleString("vi-VN") + " đ"
                );
            });

            // Click vào ảnh → chỉ lấy variant đang active
            container.find('.product-img').click(function(){

                var activeVariant = container.find(".product-size span.active"); // chỉ lấy span active
                var variantId = activeVariant.data("id");                         // id variant

                var price = activeVariant.data("price");                           // giá variant
                var idproductDetail = container.data("idpd");

                console.log("Variant ID:", variantId);
                console.log("Price:", price);

                // Redirect
                window.location.href = '/creat_cart?id=' + idproductDetail;
            });
        });

    });
</script>

</body>
</html>
