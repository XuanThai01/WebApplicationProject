
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.w3.org/1999/xhtml" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Đăng ký + Quên mật khẩu</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .modal-content {
            border-radius: 12px;
            overflow: hidden;
        }

        .switch-link {
            cursor: pointer;
            color: #0d6efd;
        }
        .switch-link:hover {
            text-decoration: underline;
        }

        /* 🔥 Hiệu ứng chuyển form */
        .fade-slide {
            transition: all 0.35s ease;
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            position: absolute;
            width: 100%;
        }

        .fade-slide.active {
            opacity: 1;
            transform: translateX(0px);
            pointer-events: auto;
            position: relative;
        }

        .modal-body {
            position: relative;
            min-height: 250px;
        }
    </style>
</head>

<body class="p-4">

<!-- BUTTON MỞ MODAL -->
<button class="btn btn-primary px-4" data-bs-toggle="modal" data-bs-target="#authModal">
    Đăng ký ngay
</button>

<!-- MODAL -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">

            <!-- HEADER -->
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Đăng Ký Tài Khoản</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <!-- BODY -->
            <div class="modal-body">

                <!-- FORM ĐĂNG KÝ -->
                <form id="registerForm" class="fade-slide active">
                    <div id="message" class="mb-3 text-center text-danger">
                        <span>Verify information!</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">user</label>
                        <input type="text" id="fullname" class="form-control" name="fullname" required>
                        <div id="fullnameError1" class="error-text"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email1" class="form-control" name="email" required>
                        <div id="emailError" class="error-text"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" id="password" class="form-control" name="password" required>
                        <div id="passwordError" class="error-text"></div>
                    </div>

                    <!-- Phần OTP -->
                    <div class="mb-3">
                        <button id="btnGetOtp" class="btn btn-info mb-2">Get OTP</button>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="text" name="otp" id="otp" class="form-control" placeholder="Nhập mã OTP" >
                        <button type="submit" id="btnVerifyOtp1" class="btn btn-success mt-2">Verify OTP & Sign Up</button>
                    </div>

                    <div class="d-flex justify-content-between">
                        <p class="text-start mt-2">
                            <span class="switch-link" id="btnSwitchToNewPassword">Đổi mật khẩu</span>
                        </p>
                        <p class="text-end mt-2">
                            <span class="switch-link" id="btnSwitchToForgot">Quên mật khẩu?</span>
                        </p>
                    </div>
                </form>


                <!-- FORM QUÊN MẬT KHẨU (ẨN MẶC ĐỊNH) -->
                <form id="forgotForm" class="fade-slide">
                    <div class="mb-3">
                        <label class="form-label">user</label>
                        <input type="text" id="fullname1" class="form-control" name="name" required>
                        <div id="fullnameError" class="error-text"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhập email để lấy mật khẩu mới</label>
                        <input type="email" id="forgotEmail" class="form-control" required>
                        <div id="forgotEmailError" class="error-text"></div>
                    </div>
                    <div class="mb-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" id="btnVerifyOtp" class="btn btn-success mt-2">Verify OTP & Sign Up</button>
                    </div>

                    <p class="mt-2">
                        <span class="switch-link" id="btnBackToRegister">← Quay lại đăng ký</span>
                    </p>
                </form>
                <!-- FORM ĐỔI MẬT KHẨU (ẨN MẶC ĐỊNH) -->
                <form id="newPasswordForm" class="fade-slide">
                    <div id="messagenewpassword" class="mb-3 text-center text-danger">
                        <span>Verify information!</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">user</label>
                        <input type="text" id="user" class="form-control">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu cũ</label>
                        <input type="password" id="oldPass" class="form-control">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" id="newPass" class="form-control">
                        <div id="newPassError" class="error-text"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nhập lại mật khẩu mới</label>
                        <input type="password" id="confirmPass" class="form-control">
                        <div id="confirmPassError" class="error-text"></div>
                    </div>
                    <div class="mb-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" id="newPassword" class="btn btn-success mt-2">đổi mật khẩu</button>
                    </div>
                    <p class="mt-2">
                        <span class="switch-link" id="btnBackToRegisterFromForgot">← Quay lại đăng ký</span>
                    </p>

                </form>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>

                <!-- SUBMIT BUTTON ĐĂNG KÝ -->
                <button type="submit" form="registerForm" id="submitRegister" class="btn btn-success">
                    Đăng ký
                </button>

                <!-- SUBMIT BUTTON QUÊN MẬT KHẨU (ẨN MẶC ĐỊNH) -->
                <button type="submit" form="forgotForm" id="submitForgot" class="btn btn-primary d-none">
                    Gửi yêu cầu
                </button>

                <!-- BUTTON LƯU MẬT KHẨU MỚI -->
                <button type="submit" form="newPasswordForm" id="submitNewPass" class="btn btn-primary d-none">
                    Cập nhật mật khẩu
                </button>
            </div>

        </div>
    </div>
</div>

<script>
    //JS XỬ LÝ ĐĂNG KÝ
const messageDiv = document.createElement("div"); // để hiển thị message
document.getElementById("forgotForm").prepend(messageDiv);

document.getElementById("forgotForm").addEventListener("submit", function(e) {
   e.preventDefault();

   const user = document.querySelector("#forgotForm input[name='name']").value.trim();
   const email = document.querySelector("#forgotForm #forgotEmail").value.trim();
   const csrfToken = document.querySelector("#forgotForm input[type='hidden']").value;

   const data = {
       user: user,
       email: email
   };

   fetch("/register/forgot-password", {
       method: "POST",
       headers: {
           "Content-Type": "application/json",
           "X-CSRF-TOKEN": csrfToken
       },
       body: JSON.stringify(data)
   })
   .then(response => response.json())
   .then(res => {
       if (res.error) {
           messageDiv.innerHTML = `<span style="color:red;">❌ ${res.error}</span>`;
       } else {
           messageDiv.innerHTML = `<span style="color:green;">✅ ${res.message}</span>`;
       }
   })
   .catch(err => {
       console.error(err);
       messageDiv.innerHTML = `<span style="color:red;">Có lỗi xảy ra!</span>`;
   });
});

document.getElementById("newPasswordForm").addEventListener("submit", function(e) {
   e.preventDefault(); // ngăn submit mặc định

   // Lấy giá trị từ form
   const user = document.getElementById("user").value.trim();
   const oldPass = document.getElementById("oldPass").value.trim();
   const newPass = document.getElementById("newPass").value.trim();
   const confirmPass = document.getElementById("confirmPass").value.trim();
   const csrfInput = newPasswordForm.querySelector('input[name="_csrf"]');
   const csrfToken = csrfInput ? csrfInput.value : '';

   // Validate cơ bản
   let ok = true;
   if (newPass.length < 6) {
       document.getElementById("newPassError").textContent = "Mật khẩu mới phải >= 6 ký tự";
       ok = false;
   } else {
       document.getElementById("newPassError").textContent = "";
   }

   if (newPass !== confirmPass) {
       document.getElementById("confirmPassError").textContent = "Mật khẩu nhập lại không trùng!";
       ok = false;
   } else {
       document.getElementById("confirmPassError").textContent = "";
   }

   if (!ok) return;

   // Tạo form data
   const formData = new FormData();
   formData.append("user", user);
   formData.append("oldPass", oldPass);
   formData.append("newPass", newPass);
   formData.append("confirmPass", confirmPass);

   if(csrfToken) formData.append("_csrf", csrfToken);

   // Gửi bằng fetch
   fetch("/register/change-password", {
       method: "POST",
       body: formData
   })
   .then(res => res.json())
   .then(res => {
       if (res.error) {
           document.getElementById("messagenewpassword").innerHTML = `<span style="color:red;">❌ ${res.error}</span>`;
       } else if (res.message) {
           document.getElementById("messagenewpassword").innerHTML = `<span style="color:green;">✅ ${res.message}</span>`;
           newPasswordForm.reset();
       }
   })
   .catch(err => {
       console.error(err);
       document.getElementById("messagenewpassword").innerHTML = `<span style="color:red;">Có lỗi xảy ra!</span>`;
   });
});

let currentOtpRequest = {};

// ======== NÚT GET OTP ========
document.getElementById("btnGetOtp").addEventListener("click", function () {

    const form = document.getElementById("registerForm");
    const formData = new FormData(form);
    const csrfToken = document.querySelector("input[name='_csrf']").value;

    fetch("/register/send-otp", {
        method: "POST",
        body: formData,
        headers: {
            "X-CSRF-TOKEN": csrfToken
        }
    })
    .then(response => response.json())
    .then(res => {
        document.getElementById("message").innerHTML =
            '<span style="font-size:13px;">✅</span> ' + res.message;

        currentOtpRequest = res.registerRequest; // lưu thông tin đăng ký
    })
    .catch(err => console.error(err));
});

// ======== SUBMIT VERIFY OTP ========
document.getElementById("btnVerifyOtp1").addEventListener("click", function () {

    const csrfToken = document.querySelector("input[name='_csrf']").value;
    const otp = document.getElementById("otp").value;

    // gộp OTP vào object đã lưu khi lấy mã OTP
    currentOtpRequest.otp = otp;

    fetch("/register/verifyADMIN", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRF-TOKEN": csrfToken
        },
        body: JSON.stringify(currentOtpRequest)
    })
    .then(res => res.json())
    .then(res => {
        document.getElementById("message").innerHTML =
            '<span style="font-size:13px;">✅</span> ' + res.message;

        // nếu có iframe overlay
        const parentDoc = window.parent.document;
        const iframeContainer = parentDoc.getElementById("iframeContainer");
        const overlay = parentDoc.getElementsByClassName("overlay")[0];

        if (iframeContainer && overlay) {
            iframeContainer.classList.remove("hienlai");
            iframeContainer.classList.add("bienmat");
            iframeContainer.addEventListener("animationend", () => {
                setTimeout(() => overlay.style.display = "none", 400);
            }, { once: true });
        }
    })
    .catch(err => {
        console.error(err);
        document.getElementById("message").textContent = "Có lỗi xảy ra!";
        document.getElementById("message").style.color = "red";
    });
});


   const registerForm = document.getElementById("registerForm");
   const forgotForm = document.getElementById("forgotForm");
   const newPasswordForm = document.getElementById("newPasswordForm");

   const btnSwitchToForgot = document.getElementById("btnSwitchToForgot");
   const btnBackToRegister = document.getElementById("btnBackToRegister");
   const btnSwitchToNewPassword = document.getElementById("btnSwitchToNewPassword");

   const submitRegister = document.getElementById("submitRegister");
   const submitForgot = document.getElementById("submitForgot");
   const submitNewPass = document.getElementById("submitNewPass");

   const modalTitle = document.getElementById("modalTitle");

   // 👉 Chuyển sang "Quên mật khẩu"
   btnSwitchToForgot.addEventListener("click", () => {
       registerForm.classList.remove("active");
       forgotForm.classList.add("active");

       submitRegister.classList.add("d-none");
       submitForgot.classList.remove("d-none");

       modalTitle.textContent = "Quên Mật Khẩu";
   });
  // 👉 chuyển sang đổi mật khẩu
  btnSwitchToNewPassword.addEventListener("click", () => {
       registerForm.classList.remove("active");
       newPasswordForm.classList.add("active");

       submitRegister.classList.add("d-none");
       newPasswordForm.classList.remove("d-none");

       modalTitle.textContent = "Đổi Mật Khẩu";
   });
   // 👉 Quay lại "Đăng ký"
   btnBackToRegister.addEventListener("click", () => {
       forgotForm.classList.remove("active");
       registerForm.classList.add("active");

       submitForgot.classList.add("d-none");
       submitRegister.classList.remove("d-none");

       modalTitle.textContent = "Đăng Ký Tài Khoản";
   });
   document.getElementById("btnBackToRegisterFromForgot").addEventListener("click", () => {
       newPasswordForm.classList.remove("active");
       registerForm.classList.add("active");

       submitForgot.classList.add("d-none");
       submitRegister.classList.remove("d-none");

       modalTitle.textContent = "Đăng Ký Tài Khoản";
});

   submitForgot.addEventListener("click", (e) => {
   e.preventDefault();

   const email = document.getElementById("forgotEmail").value.trim();

   if (!email.includes("@")) {
       document.getElementById("forgotEmailError").innerText = "Email không hợp lệ!";
       return;
   }

   forgotForm.classList.remove("active");
   newPasswordForm.classList.add("active");

   submitForgot.classList.add("d-none");
   submitNewPass.classList.remove("d-none");

   modalTitle.textContent = "Tạo Mật Khẩu Mới";
});
   // ======================
   // VALIDATION
   // ======================
   function validateFullname(name) {
       // không dấu, không khoảng trắng, không ký tự đặc biệt, không viết hoa
       const regex = /^[a-z]+$/;
       return regex.test(name);
   }

   function validatePassword(pw) {
       // >= 6 ký tự, gồm chữ + số
       const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{6,}$/;
       return regex.test(pw);
   }
document.getElementById("registerForm").addEventListener("submit", function (event) {
   event.preventDefault(); // ⛔ NGĂN SUBMIT
       const fullname = document.getElementById("fullname").value.trim();
       const email = document.getElementById("email1").value.trim();
       const password = document.getElementById("password").value.trim();

       let hasError = false;

       // Fullname check
       if (!validateFullname(fullname)) {
           document.getElementById("fullnameError1").innerText =
               "Tên chỉ được gồm chữ thường không dấu, không cách.";
           hasError = true;
       } else document.getElementById("fullnameError1").innerText = "";

       // Email check
       if (!email.includes("@")) {
           document.getElementById("emailError").innerText =
               "Email không hợp lệ.";
           hasError = true;
       } else document.getElementById("emailError").innerText = "";

       // Password check
       if (!validatePassword(password)) {
           document.getElementById("passwordError").innerText =
               "Mật khẩu phải ≥ 6 ký tự và gồm chữ + số.";
           hasError = true;
       } else document.getElementById("passwordError").innerText = "";

       if (!hasError) {
           alert("✔ Đăng ký thành công!");
       }
});
newPasswordForm.addEventListener("submit", function(e) {
   e.preventDefault();

   const pass = document.getElementById("newPass").value.trim();
   const confirm = document.getElementById("confirmPass").value.trim();

   let ok = true;

   if (!validatePassword(pass)) {
       newPassError.textContent = "Mật khẩu phải ≥ 6 ký tự và có chữ + số!";
       ok = false;
   } else newPassError.textContent = "";

   if (pass !== confirm) {
       confirmPassError.textContent = "Mật khẩu nhập lại không trùng!";
       ok = false;
   } else confirmPassError.textContent = "";

   if (ok) alert("✔ Cập nhật mật khẩu thành công!");
});
</script>


</body>
</html>
