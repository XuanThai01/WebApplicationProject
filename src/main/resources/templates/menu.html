<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/images/banner/style.css">

</head>

<body>
<div id="menu" th:fragment="menu"
     style="
    position: sticky;   /* cố định menu */
    top: 0;            /* dính lên đầu */

    width: 100%;       /* kéo full chiều ngang */

    z-index: 1000;     /* nằm trên các phần tử khác */ ">

    <!-- Header -->
    <div class="container-fluid py-2 bg-white">
        <div class="row align-items-center ">
            <!-- Logo + Name -->
            <div class="col-md-3 d-flex align-items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="logo" width="50" class="me-2">
                <h4 class="mb-0 text-danger fw-bold">Bond Bond</h4>
            </div>

            <!-- Search -->
            <div class="col-md-6 text-center position-relative">
            <form class="d-flex search-box mx-auto" autocomplete="off">
                <input id="searchInput" class="form-control me-2" type="search"
                       placeholder="tìm kiếm sản phẩm..." aria-label="Search">
                <button class="btn btn-outline-dark" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <!-- Kết quả gợi ý -->
            <div id="searchResult" class="list-group position-absolute w-100" style="z-index: 1000;"></div>
        </div>

            <!-- Address -->
            <div class="col-md-3 d-flex justify-content-end search-and-user " >
                <button id="userButton"
                        class="my-auto py-1 px-2 rounded-pill user-btn"
                        th:text="${user != null ? (user.role == 'ADMIN' ? 'Admin: ' + user.username : 'User: ' + user.username) : 'Guest ' + guestToken}"
                        style="display:inline-block; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                        margin-right: 10px; border: 1px solid rgba(37, 37, 37,0.3); background-color:white; cursor:pointer;">
                </button>
                <!-- Ẩn role và username để JS đọc -->
                <input type="hidden" id="userRole" th:value="${user != null ? user.role : 'GUEST'}">
                <input type="hidden" id="username" th:value="${user != null ? user.username : guestToken}">

               <button onclick="location.href='/page-cart'">
                    <i class="bi bi-cart fs-4 icon" ></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Menu -->
    <div class="container-fluid menu-bar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">All Products</a></li>
            <li class="">
                <a href="#">Gấu Bông Teddy</a>
            </li>
            <li class="has-sub">
                <a href="#">Gấu Ôm Mềm</a>

                <ul>
                    <li><a href="#">Doraemon</a></li>
                    <li><a href="#">Pikachu</a></li>
                    <li><a href="#">Hello Kitty</a></li>
                </ul>


            </li>
            <li class="has-sub">
                <a href="#">Thú Bông</a>

                <ul>
                    <li><a href="#"> Gấu Bông Chó</a></li>
                    <li><a href="#">Gấu Bông Mèo </a></li>
                </ul>


            </li>
            <li><a href="#">Pillows</a></li>
            <li><a href="#">About Us</a></li>
        </ul>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    console.log("chạy js");
    document.getElementById("userButton").addEventListener("click", function() {
    const role = document.getElementById("userRole").value;
    const username = document.getElementById("username").value;
    const iframeContainer = document.querySelector(".iframe-container");
    const overlay = document.getElementsByClassName("overlay")[0];

    console.log(iframeContainer);
    if (role === "ADMIN") {
        alert("Xin chào ADMIN " + username + " 👑\nĐi đến trang quản trị.");
        window.location.href = "/manage/admin/dashboard?user=" + encodeURIComponent(username);
    }

    else if (role === "USER") {
        alert("Chào mừng " + username + " 👋\nĐi đến trang cá nhân.");
        window.location.href = "/manage/user/profile"; // ví dụ
    }
    else {
        overlay.style.display = "flex";
        iframeContainer.classList.remove("bienmat");
        iframeContainer.classList.add("hienlai");
        console.log(iframeContainer);
    }

});
        const btn = document.getElementById("userButton");

        // Kiểm tra nếu text bị tràn
        const isOverflowing = btn.scrollWidth > btn.clientWidth;

        if (isOverflowing) {
            btn.addEventListener("mouseenter", () => {
            btn.style.maxWidth = btn.scrollWidth + 20 + "px"; // mở rộng đủ để thấy hết text
        });
        btn.addEventListener("mouseleave", () => {
            btn.style.maxWidth = "150px"; // thu lại
        });
        }
    </script>
</div>

</body>

</html>
