<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS cho hiệu ứng trượt các nút */
        .slide-down-btn {
    transform: translateY(-20px);
    opacity: 0;
    transition: transform 0.5s ease, opacity 0.5s ease, box-shadow 0.3s ease, background-color 0.3s ease;
    background: linear-gradient(135deg, #4e73df, #224abe);
    color: #fff;
    border: none;
    border-radius: 25px;
    padding: 0.5rem 1.2rem;
    font-weight: 500;
    box-shadow: 0 4px 8px rgba(78, 115, 223, 0.3);
    cursor: pointer;
}

/* Khi kích hoạt hiển thị (trượt xuống) */
.slide-down-btn.active {
    transform: translateY(0);
    opacity: 1;
}

/* Hover: nổi và sáng lên nhẹ */
.slide-down-btn:hover {
    background: linear-gradient(135deg, #5a5cdb, #2e59d9);
    box-shadow: 0 8px 16px rgba(78, 115, 223, 0.4);
    transform: translateY(-2px);
}

/* Click: nhún xuống */
.slide-down-btn:active {
    transform: translateY(1px);
    box-shadow: 0 3px 6px rgba(78, 115, 223, 0.2);
}
        #orderForm input,
        #orderForm textarea {
            transition: color 0.5s ease, background-color 0.5s ease;
        }

        #orderForm input:disabled,
        #orderForm textarea:disabled {
            color: #bcbdbe; /* chữ xám */
            background-color: #f8f9fa; /* optional: nền sáng */
        }
        #btnEdit {
    background-color: #f6c23e; /* Màu vàng Bootstrap */
    color: #212529;
    border: none;
    font-weight: 500;
    transition: all 0.25s ease;
    box-shadow: 0 4px 8px rgba(246, 194, 62, 0.4);
}

/* Hiệu ứng hover — sáng hơn + nổi lên */
#btnEdit:hover {
    background-color: #ffce54;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(246, 194, 62, 0.5);
}

/* Hiệu ứng click — ấn xuống nhẹ */
#btnEdit:active {
    transform: scale(0.96);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}
 img{
     width: 105px;
    height: 105px;
    object-fit: cover;  /* đảm bảo hình không méo, cắt vừa khung */
    border: 1px solid #ddd;
    border-radius: 4px;
 }
    </style>
</head>
<body class="bg-light py-4">

<div class="container">
    <div class="card shadow-lg">
        <div style="background-color: rgb(67, 87, 80);" class="card-header text-white d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <h4 class="mb-0">Chi tiết đơn hàng #<span class="order-info" th:data-oid="${order.orderId}" th:text="${order.orderId}">12345</span></h4>|
                <span class="status badge fs-6" th:text="${order.status.displayName}" style="background-color: rgb(38, 225, 14);">Đã xác nhận</span>
            </div>
        </div>

        <div class="card-body">
            <!-- Thông tin người nhận -->
            <div  class="text-white d-flex justify-content-between align-items-center mb-2">
                <h5 class=" text-secondary" >Thông tin người nhận</h5>
                <button id="btnEdit" class="btn btn-warning btn-sm ">Sửa thông tin</button>
            </div>
            <form id="orderForm">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Họ tên</label>
                        <input th:value="${order.guestName}" name="guestName" type="text" class="form-control" value="Nguyễn Văn A" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại</label>
                        <input th:value="${order.guestPhone}" name="guestPhone"  type="text" class="form-control" value="0912345678" disabled>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Địa chỉ nhận hàng</label>
                        <input th:value="${order.shippingAddress}" name="shippingAddress" type="text" class="form-control" value="123 Đường ABC, Quận 1, TP.HCM" disabled>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Ghi chú</label>
                        <textarea th:text="${order.note}" name="note" class="form-control" rows="2" disabled></textarea>
                    </div>
                </div>

                <!-- Nút lưu / hủy chỉnh sửa -->
                <div class="mb-4 text-end">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" id="btnSave" class="btn btn-success me-2 invisible">Lưu thay đổi</button>
                    <button type="button" id="btnCancel" class="btn btn-secondary invisible">Đóng</button>
                </div>
            </form>

            <!-- Danh sách sản phẩm -->
            <h5 class="text-secondary mb-3">Sản phẩm trong đơn</h5>
            <div class="border rounded p-3 mb-3">
                <div th:each="od :${order.orderDetails}">
                    <div class="row align-items-center border-bottom pb-2 mb-2">
                        <div class="col-auto">
                            <img th:src="@{${od.productVariant.productDetail.imgProduct}}" class="rounded border" alt="Ảnh sản phẩm">
                        </div>
                        <div class="col">
                            <h6 th:text="${od.productVariant.productDetail.name}" class="mb-1 fw-semibold">Áo thun nam cotton</h6>
                            <div th:text="'Phân loại: '+${od.productVariant.size}+' , '+${od.productVariant.color}" class="text-muted small">Phân loại: Trắng, Size M</div>
                            <div th:text="'x'+${od.quantity}" class="small">x1</div>
                        </div>
                        <div class="col-auto text-end">
                            <span th:text="${od.productVariant.price}">250.000đ</span>
                        </div>
                    </div>
                </div>


            </div>

            <!-- Tổng tiền -->
            <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-4">

                <div>
                    <span class="fs-6">Tổng cộng:</span>
                    <span th:text="${order.totalAmount}" class="fw-bold text-danger fs-5">670.000đ</span>
                </div>
            </div>

            <!-- Tiến trình giao hàng -->


            <!-- Nút hủy đơn -->
            <div class="text-end">
                <button  th:data-id="${order.orderId}" id="btnCancelOrder" class="btn btn-danger">Hủy đơn hàng</button>
            </div>
        </div>
    </div>
</div>

<script>
    const btnEdit = document.getElementById("btnEdit");
    const btnSave = document.getElementById("btnSave");
    const btnCancel = document.getElementById("btnCancel");
    const inputs = document.querySelectorAll("#orderForm input, #orderForm textarea");

    btnSave.classList.add("slide-down-btn");
    btnCancel.classList.add("slide-down-btn");

    btnEdit.addEventListener("click", () => {
        inputs.forEach(i => i.removeAttribute("disabled"));
        btnSave.classList.remove("invisible");
        btnCancel.classList.remove("invisible");

        setTimeout(() => {
        btnSave.classList.add("active");
        btnCancel.classList.add("active");
        }, 100);

    });

    btnCancel.addEventListener("click", () => {
      inputs.forEach(i => i.setAttribute("disabled", "true"));
      btnSave.classList.remove("active");
      btnCancel.classList.remove("active");
      setTimeout(() => {
        inputs.forEach((i, index) => {
            i.value = initialValues[index];
            i.setAttribute("disabled", "true");
        });
        btnSave.classList.add("slide-down-btn");
        btnCancel.classList.add("slide-down-btn");
        }, 100);

    });

    // Giả sử trạng thái đơn hàng hiện tại là ĐÃ GIAO hoặc ĐANG XÁC NHẬN
    const orderStatus =document.querySelector(".status").textContent;
    const cancelButton = document.getElementById("btnCancelOrder");
    if (orderStatus === "Đang xử lý"  || orderStatus === "Đã xác nhận") {
        btnEdit.setAttribute("disabled", "true");
        cancelButton.setAttribute("disabled", "true");
        cancelButton.classList.add("btn-secondary");
        cancelButton.classList.remove("btn-danger");
        cancelButton.textContent = "Không thể hủy đơn";
    }
document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("orderForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Lấy CSRF token từ input hidden
            const csrfToken = document.querySelector('input[name="_csrf"]').value;

            // Lấy dữ liệu form
            const data = {
                ido : document.querySelector(".order-info").getAttribute("data-oid"),
                guestName: document.querySelector('input[name="guestName"]').value,
                guestPhone: document.querySelector('input[name="guestPhone"]').value,
                shippingAddress: document.querySelector('input[name="shippingAddress"]').value,
                note: document.querySelector('textarea[name="note"]').value
            };

            try {
                const response = await fetch("/orders/save", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": csrfToken  // 👈 gửi kèm token vào header
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error("Gửi thất bại");

                const result = await response.json();
                console.log("Server phản hồi:", result);
                alert("Gửi thành công!");
            } catch (err) {
                console.error(err);
                alert("Lỗi khi gửi dữ liệu!");
            }
        });

           // Lấy danh sách nút xóa

   });

 document.addEventListener("DOMContentLoaded", function() {
    const btnCancelOrder = document.querySelector("#btnCancelOrder");

    if (btnCancelOrder) {
        btnCancelOrder.addEventListener("click", async function() {
            const orderId = this.getAttribute("data-id");
            const csrfToken = document.querySelector('input[name="_csrf"]').value;

            if (!confirm(`Bạn có chắc muốn xóa đơn hàng #${orderId} không?`)) {
                return;
            }

            try {
                const response = await fetch(`/orders/delete`, {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": csrfToken
                    },
                    body: JSON.stringify({ id: orderId }) // dùng RequestBody JSON
                });

                if (response.ok) {
                    alert("✅ Xóa đơn hàng thành công!");
                   window.location.href = "/page-cart"
                } else {
                    const text = await response.text();
                    alert("❌ Xóa thất bại: " + text);
                }
            } catch (error) {
                console.error("Lỗi khi xóa:", error);
                alert("⚠️ Có lỗi xảy ra khi xóa đơn hàng!");
            }
        });
    }
});

</script>

</body>
</html>
