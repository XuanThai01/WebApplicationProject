<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-3">Giỏ hàng của bạn</h2>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>ID</th>
        <th>Product ID</th>
        <th>Số lượng</th>
        <th>Guest Token</th>
        <th>User ID</th>
        <th>Ngày tạo</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${carts}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.productId}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.guestToken}"></td>
        <td th:text="${item.userId}"></td>
        <td th:text="${item.createdAt}"></td>
    </tr>
    </tbody>
</table>

<h3 class="mt-4">Thêm sản phẩm vào giỏ</h3>
<form th:action="@{/cart/add}" method="post" class="mt-3">
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Product ID</th>
            <th>Số lượng</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td><input type="number" name="productId" class="form-control" required></td>
            <td><input type="number" name="quantity" class="form-control" min="1" value="1" required></td>

            <td><button type="submit" class="btn btn-success">Thêm</button></td>
        </tr>
        </tbody>
    </table>
</form>

</body>
</html>
