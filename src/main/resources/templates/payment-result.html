<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>VNPay Result</title>
    <!-- Link Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <!-- Heading kết quả -->
    <h2 class="text-success mb-4" th:text="${message}">Kết quả</h2>

    <!-- Chi tiết trả về -->
    <h3 class="mb-3">Chi tiết trả về:</h3>
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Key</th>
                <th>Value</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${params.entrySet()}">
                <td th:text="${entry.key}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Link quay lại -->
    <a href="/listpd" class="btn btn-primary mt-3">Quay lại trang chủ</a>

</div>

</body>
</html>
